name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r services/render-api/requirements.txt
          pip install -e ".[dev]"

      - name: Byte-compile sources
        run: python -m compileall -q tradeanim examples tests services

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -q tests services/render-api/tests

  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADEANIM_SKIP_PYTHON: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:js
