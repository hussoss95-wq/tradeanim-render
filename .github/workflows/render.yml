name: Render Tradeanim Full HD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # The tradeanim library is vendored in this repository (see UPSTREAM.md),
      # so a single checkout provides both the engine and the examples.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Render showcase
        env:
          MPLBACKEND: Agg
        run: |
          python examples/showcase.py

      - name: Verify rendered MP4
        run: |
          VIDEO="showcase_v3.mp4"

          if [ ! -s "$VIDEO" ]; then
            echo "ERROR: $VIDEO was not generated."
            find . -type f -name "*.mp4" -print
            exit 1
          fi

          echo "Video information:"
          ffprobe -v error \
            -show_entries stream=width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

      - name: Upload Full HD video
        uses: actions/upload-artifact@v4
        with:
          name: tradeanim-showcase-fullhd
          path: showcase_v3.mp4
          if-no-files-found: error
          retention-days: 7
